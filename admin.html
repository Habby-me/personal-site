<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>网站内容管理后台 · Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070916;
      --panel: rgba(17, 22, 44, 0.9);
      --field: rgba(5, 7, 18, 0.58);
      --line: rgba(196, 205, 255, 0.13);
      --text: #f5f3ff;
      --muted: #a5abc3;
      --accent: #a995ff;
      --blue: #72c7ff;
      --danger: #ef6572;
      --success: #5ad4a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 34px 20px 70px;
      color: var(--text);
      background:
        radial-gradient(
          circle at 78% 8%,
          rgba(105, 78, 207, 0.17),
          transparent 28%
        ),
        radial-gradient(
          circle at 8% 60%,
          rgba(45, 145, 190, 0.1),
          transparent 32%
        ),
        var(--bg);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .container {
      max-width: 860px;
      margin: auto;
    }

    .topbar {
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      font-size: 1.65rem;
    }

    .back-link {
      color: var(--blue);
      font-size: 0.9rem;
      text-decoration: none;
    }

    .card-box {
      margin-bottom: 22px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .card-title {
      margin-bottom: 19px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.08rem;
    }

    .card-title span {
      width: 25px;
      height: 25px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--blue);
      font-size: 0.72rem;
    }

    .form-group {
      flex: 1;
      margin-bottom: 17px;
    }

    .flex-row {
      display: flex;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 500;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      color: #fff;
      background: var(--field);
      font: inherit;
      font-size: 0.92rem;
      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    textarea {
      resize: vertical;
      line-height: 1.55;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow:
        0 0 0 3px rgba(169, 149, 255, 0.1);
    }

    .notice {
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .project-item {
      margin-bottom: 15px;
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(5, 7, 18, 0.38);
    }

    .project-item-head {
      margin-bottom: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .project-number {
      color: var(--blue);
      font-size: 0.7rem;
      letter-spacing: 0.16em;
    }

    .project-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .btn {
      padding: 10px 19px;
      border: 0;
      border-radius: 9px;
      color: white;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition:
        opacity 0.2s,
        transform 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary {
      padding: 12px 26px;
      color: #080a15;
      background:
        linear-gradient(
          135deg,
          #d9d0ff,
          #83d2ff
        );
    }

    .btn-secondary {
      margin-top: 3px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.07);
    }

    .btn-move {
      padding: 6px 10px;
      border: 1px solid var(--line);
      color: #d9d7e8;
      background: rgba(255, 255, 255, 0.06);
      font-size: 0.75rem;
    }

    .btn-move:disabled {
      opacity: 0.28;
      cursor: not-allowed;
      transform: none;
    }

    .btn-danger {
      padding: 6px 11px;
      color: #ffc4ca;
      background: rgba(239, 101, 114, 0.13);
      font-size: 0.75rem;
    }

    .save-area {
      text-align: right;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 0.88rem;
    }

    @media (max-width: 650px) {
      body {
        padding: 24px 14px 55px;
      }

      .card-box {
        padding: 20px;
      }

      .flex-row {
        display: block;
      }

      .topbar {
        align-items: flex-start;
      }

      .project-item-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .project-actions {
        width: 100%;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="topbar">
      <h1>网站内容管理</h1>

      <a class="back-link" href="index.html">
        ← 返回首页
      </a>
    </header>

    <section class="card-box">
      <h2 class="card-title">
        <span>01</span>
        GitHub 提交配置
      </h2>

      <div class="flex-row">
        <div class="form-group">
          <label for="repoPath">
            GitHub 用户名 / 仓库名
          </label>

          <input
            type="text"
            id="repoPath"
            value="Habby-me/personal-site"
            placeholder="Habby-me/personal-site"
          >
        </div>

        <div class="form-group">
          <label for="ghToken">
            Personal Access Token
          </label>

          <input
            type="password"
            id="ghToken"
            placeholder="github_pat_xxxxxx"
            autocomplete="off"
          >
        </div>
      </div>

      <p class="notice">
        Token 仅保存在当前浏览器中，并且需要 personal-site
        仓库的 Contents：Read and write 权限。
      </p>
    </section>

    <section class="card-box">
      <h2 class="card-title">
        <span>02</span>
        基本信息设置
      </h2>

      <div class="form-group">
        <label for="siteName">
          网站名称 / Logo 标识
        </label>
        <input type="text" id="siteName">
      </div>

      <div class="form-group">
        <label for="heroEyebrow">
          首屏眉标题 / 英文小标题
        </label>
        <input type="text" id="heroEyebrow">
      </div>

      <div class="form-group">
        <label for="heroTitle">
          Hero 大标题
        </label>
        <textarea id="heroTitle" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label for="heroSubtitle">
          Hero 副标题 / 签名
        </label>
        <input type="text" id="heroSubtitle">
      </div>

      <div class="form-group">
        <label for="aboutText">
          关于我
        </label>
        <textarea id="aboutText" rows="6"></textarea>
      </div>

      <div class="form-group">
        <label for="motto">
          个人短句 / Motto
        </label>
        <input type="text" id="motto">
      </div>

      <div class="form-group">
        <label for="skills">
          技能标签（用中文或英文逗号分隔）
        </label>

        <input
          type="text"
          id="skills"
          placeholder="UI Design, HTML / CSS, JavaScript"
        >
      </div>

      <div class="form-group">
        <label for="contactText">
          联系区说明
        </label>
        <textarea id="contactText" rows="3"></textarea>
      </div>

      <div class="flex-row">
        <div class="form-group">
          <label for="contactButton">
            联系按钮文字
          </label>
          <input type="text" id="contactButton">
        </div>

        <div class="form-group">
          <label for="contactLink">
            联系按钮链接
          </label>

          <input
            type="text"
            id="contactLink"
            placeholder="mailto:you@example.com 或 https://..."
          >
        </div>
      </div>
    </section>

    <section class="card-box">
      <h2 class="card-title">
        <span>03</span>
        精选项目管理
      </h2>

      <div id="projectsContainer"></div>

      <button
        class="btn btn-secondary"
        type="button"
        id="addProjectBtn"
      >
        ＋ 添加新项目
      </button>
    </section>

    <div class="save-area">
      <button
        class="btn btn-primary"
        type="button"
        id="saveBtn"
      >
        保存并同步到 GitHub
      </button>

      <div
        class="status-msg"
        id="statusMsg"
        role="status"
      ></div>
    </div>
  </div>

  <script>
    const $ = id =>
      document.getElementById(id);

    const escapeHTML = value =>
      String(value ?? "").replace(
        /[&<>'"]/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"
        })[character]
      );

    const visualOptions = [
      ["stars", "星座微光"],
      ["planet", "环形星球"],
      ["nebula", "梦幻星云"],
      ["meteor", "流星轨迹"],
      ["galaxy", "旋涡星系"]
    ];

    let projectsData = [];

    function normalizeProject(
      project = {}
    ) {
      const visualExists =
        visualOptions.some(
          ([type]) =>
            type === project.type
        );

      return {
        title:
          project.title || "",

        description:
          project.description || "",

        type:
          project.type === "pattern"
            ? "stars"
            : visualExists
              ? project.type
              : "stars",

        link:
          project.link || "#"
      };
    }

    function renderProjectList() {
      $("projectsContainer").innerHTML =
        projectsData
          .map((project, index) => `
            <article class="project-item">
              <div class="project-item-head">
                <div class="project-number">
                  PROJECT ·
                  ${String(index + 1).padStart(2, "0")}
                </div>

                <div class="project-actions">
                  <button
                    class="btn btn-move"
                    type="button"
                    data-move="-1"
                    data-index="${index}"
                    ${index === 0 ? "disabled" : ""}
                  >
                    ↑ 上移
                  </button>

                  <button
                    class="btn btn-move"
                    type="button"
                    data-move="1"
                    data-index="${index}"
                    ${
                      index === projectsData.length - 1
                        ? "disabled"
                        : ""
                    }
                  >
                    ↓ 下移
                  </button>

                  <button
                    class="btn btn-danger"
                    type="button"
                    data-remove="${index}"
                  >
                    删除
                  </button>
                </div>
              </div>

              <div class="form-group">
                <label>项目标题</label>

                <input
                  type="text"
                  value="${escapeHTML(project.title)}"
                  data-field="title"
                  data-index="${index}"
                >
              </div>

              <div class="form-group">
                <label>项目简介</label>

                <textarea
                  rows="3"
                  data-field="description"
                  data-index="${index}"
                >${escapeHTML(project.description)}</textarea>
              </div>

              <div class="flex-row">
                <div class="form-group">
                  <label>预览视觉样式</label>

                  <select
                    data-field="type"
                    data-index="${index}"
                  >
                    ${visualOptions
                      .map(
                        ([value, label]) => `
                          <option
                            value="${value}"
                            ${
                              project.type === value
                                ? "selected"
                                : ""
                            }
                          >
                            ${label}
                          </option>
                        `
                      )
                      .join("")}
                  </select>
                </div>

                <div class="form-group">
                  <label>跳转链接 URL</label>

                  <input
                    type="text"
                    value="${escapeHTML(project.link)}"
                    data-field="link"
                    data-index="${index}"
                    placeholder="https://..."
                  >
                </div>
              </div>
            </article>
          `)
          .join("");
    }

    function updateProject(event) {
      const index =
        Number(
          event.target.dataset.index
        );

      const field =
        event.target.dataset.field;

      if (
        !Number.isInteger(index) ||
        !field ||
        !projectsData[index]
      ) {
        return;
      }

      projectsData[index][field] =
        event.target.value;
    }

    function showStatus(
      message,
      color = "var(--text)"
    ) {
      $("statusMsg").style.color =
        color;

      $("statusMsg").textContent =
        message;
    }

    async function init() {
      $("ghToken").value =
        localStorage.getItem(
          "gh_token"
        ) || "";

      $("repoPath").value =
        localStorage.getItem(
          "gh_repo"
        ) ||
        "Habby-me/personal-site";

      try {
        const response =
          await fetch(
            `data.json?t=${Date.now()}`
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        $("siteName").value =
          data.name || "";

        $("heroEyebrow").value =
          data.heroEyebrow || "";

        $("heroTitle").value =
          data.heroTitle || "";

        $("heroSubtitle").value =
          data.heroSubtitle || "";

        $("aboutText").value =
          data.about || "";

        $("motto").value =
          data.motto || "";

        $("skills").value =
          (data.skills || [])
            .join(", ");

        $("contactText").value =
          data.contactText || "";

        $("contactButton").value =
          data.contactButton || "";

        $("contactLink").value =
          data.contactLink || "";

        projectsData =
          (data.projects || [])
            .map(normalizeProject);

        renderProjectList();
      } catch (error) {
        console.error(error);

        showStatus(
          "无法加载 data.json，请确认三个文件位于同一目录。",
          "var(--danger)"
        );
      }
    }

    async function saveToGitHub() {
      const repo =
        $("repoPath").value.trim();

      const token =
        $("ghToken").value.trim();

      if (!repo || !token) {
        showStatus(
          "请先填写仓库名称和 Personal Access Token。",
          "var(--danger)"
        );

        return;
      }

      localStorage.setItem(
        "gh_token",
        token
      );

      localStorage.setItem(
        "gh_repo",
        repo
      );

      const payload = {
        name:
          $("siteName").value.trim(),

        heroEyebrow:
          $("heroEyebrow").value.trim(),

        heroTitle:
          $("heroTitle").value,

        heroSubtitle:
          $("heroSubtitle").value.trim(),

        about:
          $("aboutText").value,

        motto:
          $("motto").value.trim(),

        skills:
          $("skills")
            .value
            .split(/[,，]/)
            .map(item => item.trim())
            .filter(Boolean),

        contactText:
          $("contactText").value,

        contactButton:
          $("contactButton").value.trim(),

        contactLink:
          $("contactLink").value.trim(),

        projects:
          projectsData.map(
            normalizeProject
          )
      };

      const button =
        $("saveBtn");

      button.disabled = true;

      showStatus(
        "正在连接 GitHub 并保存……",
        "var(--muted)"
      );

      try {
        const url =
          `https://api.github.com/repos/${repo}/contents/data.json`;

        const headers = {
          Authorization:
            `Bearer ${token}`,

          Accept:
            "application/vnd.github+json",

          "X-GitHub-Api-Version":
            "2022-11-28"
        };

        const currentResponse =
          await fetch(
            url,
            { headers }
          );

        if (!currentResponse.ok) {
          const error =
            await currentResponse
              .json()
              .catch(() => ({}));

          throw new Error(
            error.message ||
            `读取失败（${currentResponse.status}）`
          );
        }

        const current =
          await currentResponse.json();

        const content = btoa(
          unescape(
            encodeURIComponent(
              JSON.stringify(
                payload,
                null,
                2
              )
            )
          )
        );

        const saveResponse =
          await fetch(
            url,
            {
              method: "PUT",

              headers: {
                ...headers,
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message:
                  "Update site content via admin panel",

                content,
                sha: current.sha
              })
            }
          );

        if (!saveResponse.ok) {
          const error =
            await saveResponse
              .json()
              .catch(() => ({}));

          throw new Error(
            error.message ||
            `保存失败（${saveResponse.status}）`
          );
        }

        showStatus(
          "✓ 保存成功，GitHub Pages 将在几分钟内更新。",
          "var(--success)"
        );
      } catch (error) {
        console.error(error);

        const permissionHint =
          /accessible|permission|403/i
            .test(error.message)
              ? " 请检查 Token 的 Contents：Read and write 权限。"
              : "";

        showStatus(
          `保存失败：${error.message}${permissionHint}`,
          "var(--danger)"
        );
      } finally {
        button.disabled = false;
      }
    }

    $("projectsContainer")
      .addEventListener(
        "input",
        updateProject
      );

    $("projectsContainer")
      .addEventListener(
        "change",
        updateProject
      );

    $("projectsContainer")
      .addEventListener(
        "click",
        event => {
          const move =
            Number(
              event.target.dataset.move
            );

          const itemIndex =
            Number(
              event.target.dataset.index
            );

          if (
            Number.isInteger(move) &&
            Number.isInteger(itemIndex) &&
            move !== 0
          ) {
            const targetIndex =
              itemIndex + move;

            if (
              targetIndex < 0 ||
              targetIndex >=
                projectsData.length
            ) {
              return;
            }

            [
              projectsData[itemIndex],
              projectsData[targetIndex]
            ] = [
              projectsData[targetIndex],
              projectsData[itemIndex]
            ];

            renderProjectList();
            return;
          }

          const removeIndex =
            Number(
              event.target.dataset.remove
            );

          if (
            !Number.isInteger(
              removeIndex
            )
          ) {
            return;
          }

          projectsData.splice(
            removeIndex,
            1
          );

          renderProjectList();
        }
      );

    $("addProjectBtn")
      .addEventListener(
        "click",
        () => {
          projectsData.push(
            normalizeProject({
              title:
                "新项目标题",

              description:
                "用一句话介绍这个项目。",

              type:
                "stars",

              link:
                "#"
            })
          );

          renderProjectList();
        }
      );

    $("saveBtn")
      .addEventListener(
        "click",
        saveToGitHub
      );

    init();
  </script>
</body>
</html>
